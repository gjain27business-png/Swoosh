<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PAUSE admin</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
body.adm{background:#EEF4F3;color:var(--ink);font-size:14px}
[hidden]{display:none!important}
.adm h1,.adm h2,.adm h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;color:var(--heading);line-height:1.15}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:380px;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:32px;box-shadow:0 24px 60px -30px rgba(4,30,44,.35)}
.login h1{font-size:26px;margin:22px 0 6px}.login p{margin:0 0 22px;color:var(--muted)}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#062433;color:#CFE3E0;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}.side .brand small{font-size:12px;color:#8FB4B8;font-weight:600;letter-spacing:.02em}
.side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#CFE3E0;text-decoration:none;font-weight:600;font-size:14px}
.side a.nav:hover{background:rgba(255,255,255,.06)}
.side a.nav[aria-current="page"]{background:rgba(255,107,87,.16);color:#fff}
.side a.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .count{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:10px;background:var(--coral);color:#08263A;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.side .count.muted{background:rgba(255,255,255,.12);color:#CFE3E0}
.side .grow{flex:1}.side .foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.side .foot a,.side .foot button{display:block;text-align:left;padding:9px 12px;border-radius:10px;color:#8FB4B8;text-decoration:none;background:none;border:none;font:inherit;font-size:13px;cursor:pointer}
.side .foot a:hover,.side .foot button:hover{color:#fff;background:rgba(255,255,255,.06)}
.main{min-width:0;padding:0 32px 48px}
.bar{display:flex;align-items:center;gap:16px;padding:22px 0 18px;position:sticky;top:0;background:#EEF4F3;z-index:5}
.bar h1{font-size:26px;margin:0}.bar .sp{flex:1}.bar .upd{font-size:12px;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.coral{background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}.btn.coral:hover{background:var(--coral-hover)}
.panel{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:20px}
.panel h2{font-size:17px;margin:0 0 14px}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit;display:block}
.kpi small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--heading);margin-top:6px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:#FFB8AA;background:#FFF5F2}.kpi.alert b{color:#C8372D}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--primary);min-height:2px}
.chart .c i.m{background:var(--coral)}
.chart .c em{font-style:normal;font-size:10px;color:var(--muted)}
.chart .pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:100%}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar div{height:10px;border-radius:5px;background:var(--wash);overflow:hidden}.hbar div i{display:block;height:100%;background:var(--primary);border-radius:5px}
.hbar b{text-align:right;font-weight:700;color:var(--heading)}
.todo a{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:var(--ink);font-weight:600}.todo a:last-child{border:none}
.todo a b{color:var(--heading)}
/* review */
.review{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.qlist{background:#fff;border:1px solid var(--hair);border-radius:16px;overflow:hidden;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto}
.qitem{display:block;width:100%;text-align:left;padding:14px 16px;border:none;border-bottom:1px solid var(--hair);background:#fff;font:inherit;cursor:pointer}
.qitem:hover{background:#F6FAF9}.qitem[aria-current="true"]{background:#E6F2EF;box-shadow:inset 3px 0 0 var(--coral)}
.qitem b{display:block;color:var(--heading);font-size:14px}.qitem small{color:var(--muted);font-size:12px}
.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--wash);color:var(--heading)}
.tag.id{background:#FFF4D6;color:#6B4A00}.tag.re{background:#E6E1FF;color:#3D2E8C}
.detail .head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.detail .head h2{font-size:24px;margin:0 0 4px}.meta{color:var(--muted);font-size:13px;line-height:1.7}
.linkbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.linkbtns a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--hair2);text-decoration:none;color:var(--heading);font-weight:700;font-size:13px;background:#fff}
.linkbtns a:hover{border-color:var(--primary)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.gallery figure{margin:0}.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:var(--wash);cursor:zoom-in;display:block}
.gallery figcaption{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.idbox{border:1px solid #F3D89A;background:#FFFBEF;border-radius:14px;padding:14px 16px;margin:6px 0 14px}
.idbox b{letter-spacing:.06em}
.about{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.about div{background:var(--wash);border-radius:12px;padding:12px 14px}.about small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
.check{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--ink)}
.check li::before{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--coral);margin-right:10px;vertical-align:2px}
.actbar{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 0 4px;background:linear-gradient(transparent,#fff 30%)}
.kbd{font-size:11px;color:var(--muted)}.kbd kbd{font:inherit;font-weight:700;border:1px solid var(--hair2);border-radius:4px;padding:0 5px;background:#fff}
/* tables */
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tools input,.tools select{height:40px;border-radius:10px;border:1px solid var(--hair2);padding:0 12px;font:inherit;background:#fff;min-width:240px}
.tools select{min-width:160px}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.t th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:12px 14px;background:#F6FAF9;border-bottom:1px solid var(--hair)}
.t td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:middle}
.t tr:last-child td{border-bottom:none}.t tbody tr:hover td{background:#F9FCFB}.t tr.click{cursor:pointer}
.t td b{color:var(--heading)}.t td small{display:block;color:var(--muted);font-size:12px}
.chip-s{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:capitalize}
.st-verified{background:#DDF4EC;color:#13684F}.st-pending{background:#FFF4D6;color:#6B4A00}.st-new{background:var(--wash);color:var(--muted)}
.st-rejected{background:#FFE5DE;color:#A23422}.st-banned{background:#1A0F14;color:#fff}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.empty-s{padding:48px 20px;text-align:center;color:var(--muted)}.empty-s b{display:block;font-family:var(--display);font-size:20px;color:var(--heading);margin-bottom:6px}
/* drawer, dialog, lightbox, toast */
.scrim{position:fixed;inset:0;background:rgba(4,30,44,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:31;padding:24px;overflow-y:auto;box-shadow:-20px 0 60px -30px rgba(4,30,44,.5)}
.dlg{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));background:#fff;border-radius:18px;padding:24px;box-shadow:0 30px 80px -30px rgba(4,30,44,.6)}
.dlg h3{font-size:20px;margin:0 0 6px}.dlg p{color:var(--muted);margin:0 0 14px}
.dlg label.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--hair);border-radius:10px;margin-bottom:6px;cursor:pointer}
.dlg label.opt:has(input:checked){border-color:var(--primary);background:#F0F8F6}
.dlg textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid var(--hair2);padding:10px;font:inherit;margin-top:6px}
.dlg .row2{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(4,20,30,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lb img{max-width:92vw;max-height:92vh;border-radius:12px}
.toast-a{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#062433;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-weight:600}
.btn.danger{background:#C8372D;border-color:#C8372D;color:#fff}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.side .brand{padding:0 8px 0 0;width:100%}
  .side .grow,.side .foot{display:none}.main{padding:0 16px 40px}.cols,.review,.about{grid-template-columns:1fr}.qlist{position:static;max-height:320px}
}
</style>
</head>
<body class="adm">
<div class="login" id="login">
  <form id="lf">
    <span class="wordmark"><i class="mk" aria-hidden="true"><b></b><b></b></i>pause</span>
    <h1>Admin</h1><p>Review members, reports and support.</p>
    <div class="field"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn block" type="submit">Sign in</button>
  </form>
</div>
<div class="shell" id="shell" hidden>
  <aside class="side" aria-label="Admin">
    <div class="brand"><span class="wordmark light"><i class="mk" aria-hidden="true"><b></b><b></b></i>pause</span><small>ADMIN</small></div>
    <nav id="nav" style="display:contents"></nav>
    <div class="grow"></div>
    <div class="foot"><a href="/" target="_blank" rel="noopener">Open the site</a><a href="/app" target="_blank" rel="noopener">Open the app</a><button id="out" type="button">Sign out</button></div>
  </aside>
  <main class="main">
    <header class="bar"><h1 id="title">Overview</h1><span class="sp"></span><span class="upd" id="upd"></span><button class="btn ghost sm" id="refresh" type="button">Refresh</button></header>
    <div id="view"></div>
  </main>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
let PW = sessionStorage.getItem('pzpw') || '';
let COUNTS = {};
async function api(path, opts = {}) {
  const r = await fetch('/api/admin' + path, { method: opts.method || 'GET', headers: { 'x-admin-password': PW, 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { signOut(); throw new Error('Wrong admin password'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}
// Images need the admin header, so load them as blobs.
async function img(path, el) {
  const r = await fetch('/api/admin' + path, { headers: { 'x-admin-password': PW } });
  if (r.ok) el.src = URL.createObjectURL(await r.blob()); else el.alt = 'Not available';
}
const loadImgs = (root) => root.querySelectorAll('img[data-src]').forEach((i) => img(i.dataset.src, i));
const ago = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
const date = (t) => new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
const toast = (t) => { const d = document.createElement('div'); d.className = 'toast-a'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); };
const IC = {
  overview: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/>',
  review: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  members: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5"/>',
  reports: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
  flags: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/>',
  tickets: '<path d="M4 5h16v11H8l-4 4z"/>',
  waitlist: '<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'
};
const SECTIONS = [['overview', 'Overview'], ['review', 'Review queue', 'pending'], ['members', 'Members'], ['reports', 'Reports', 'open_reports'], ['flags', 'Scam flags', 'scam_flags', true], ['tickets', 'Help tickets', 'open_tickets'], ['waitlist', 'Waitlist', 'waitlist', true]];
function drawNav(cur) {
  $('nav').innerHTML = SECTIONS.map(([k, label, ck, muted]) => {
    const n = ck ? COUNTS[ck] : 0;
    return `<a class="nav" href="#${k}" ${cur === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${label}${n ? `<span class="count ${muted ? 'muted' : ''}">${n}</span>` : ''}</a>`;
  }).join('');
}
function signOut() { PW = ''; sessionStorage.removeItem('pzpw'); $('shell').hidden = true; $('login').hidden = false; }
function closeLayer() { document.querySelectorAll('.scrim,.drawer,.dlg,.lb').forEach((e) => e.remove()); }
function lightbox(src) { const d = document.createElement('div'); d.className = 'lb'; d.innerHTML = `<img src="${src}" alt="">`; d.onclick = () => d.remove(); document.body.appendChild(d); }
document.addEventListener('click', (e) => { const i = e.target.closest('.gallery img'); if (i && i.src) lightbox(i.src); });
function ask({ title, body = '', ok = 'Confirm', danger = false, options = null }) {
  return new Promise((resolve) => {
    closeLayer();
    const s = document.createElement('div'); s.className = 'scrim';
    const d = document.createElement('div'); d.className = 'dlg'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<h3>${esc(title)}</h3>${body ? `<p>${esc(body)}</p>` : ''}
      ${options ? options.map((o, i) => `<label class="opt"><input type="radio" name="why" value="${esc(o)}" ${i === 0 ? 'checked' : ''}>${esc(o)}</label>`).join('') + '<label class="opt"><input type="radio" name="why" value="__other">Something else</label><textarea id="whyx" placeholder="Shown to the member" hidden></textarea>' : ''}
      <div class="row2"><button class="btn ghost sm" type="button" id="dno">Cancel</button><button class="btn sm ${danger ? 'danger' : ''}" type="button" id="dok">${esc(ok)}</button></div>`;
    document.body.append(s, d);
    const done = (v) => { closeLayer(); resolve(v); };
    s.onclick = () => done(false); d.querySelector('#dno').onclick = () => done(false);
    if (options) d.querySelectorAll('input[name=why]').forEach((r) => r.onchange = () => { d.querySelector('#whyx').hidden = r.value !== '__other' || !r.checked; });
    d.querySelector('#dok').onclick = () => {
      if (!options) return done(true);
      const v = d.querySelector('input[name=why]:checked').value;
      done(v === '__other' ? (d.querySelector('#whyx').value.trim() || 'Didn’t pass the check') : v);
    };
    d.querySelector('#dok').focus();
  });
}

// ---------- sections ----------
async function overview() {
  const s = await api('/stats');
  const kpi = (label, v, sub = '', href = '', alert = false) => `<${href ? `a href="${href}"` : 'div'} class="kpi ${alert ? 'alert' : ''}"><small>${label}</small><b>${v}</b>${sub ? `<span>${sub}</span>` : ''}</${href ? 'a' : 'div'}>`;
  const maxD = Math.max(1, ...s.days.map((d) => Math.max(d.signups, d.matches)));
  const cats = [['Steady', s.steady], ['Forever', s.forever], ['After Dark', s.afterdark]], maxC = Math.max(1, ...cats.map((c) => c[1]));
  const maxCity = Math.max(1, ...s.cities.map((c) => c.n));
  $('view').innerHTML = `
    <div class="kpis">
      ${kpi('Members', s.users, `${s.signups_7d} joined in 7 days`)}
      ${kpi('Verified', s.verified, `${s.id_verified} with ID badge`)}
      ${kpi('Waiting for review', s.pending, s.pending ? 'Open the queue' : 'All caught up', '#review', s.pending > 0)}
      ${kpi('Women / men', `${s.women} / ${s.men}`, 'verified members')}
      ${kpi('Open matches', s.active_chats, `${s.matches_24h} new in 24 hours`)}
      ${kpi('Messages, 24 hours', s.messages_24h, `${s.likes_24h} likes in 24 hours`)}
      ${kpi('Location on', s.located, s.users ? Math.round(s.located / s.users * 100) + '% of members' : '')}
      ${kpi('Destiny on', s.destiny_on)}
    </div>
    <div class="cols">
      <div class="panel"><h2>Last 14 days</h2>
        <div class="chart">${s.days.map((d) => `<div class="c" title="${d.day}: ${d.signups} sign-ups, ${d.matches} matches"><div class="pair"><i style="height:${d.signups / maxD * 100}%"></i><i class="m" style="height:${d.matches / maxD * 100}%"></i></div><em>${d.day.slice(8)}</em></div>`).join('')}</div>
        <div class="legend"><span><i style="background:var(--primary)"></i>Sign-ups</span><span><i style="background:var(--coral)"></i>Matches</span></div></div>
      <div class="panel todo"><h2>Needs attention</h2>
        <a href="#review">Review queue <b>${s.pending}</b></a><a href="#reports">Open reports <b>${s.open_reports}</b></a>
        <a href="#flags">Scam-flagged messages <b>${s.scam_flags}</b></a><a href="#tickets">Help tickets <b>${s.open_tickets}</b></a>
        <a href="#members">Banned members <b>${s.banned}</b></a></div>
    </div>
    <div class="cols" style="grid-template-columns:1fr 1fr">
      <div class="panel"><h2>Categories (verified)</h2>${cats.map(([k, v]) => `<div class="hbar"><span>${k}</span><div><i style="width:${v / maxC * 100}%"></i></div><b>${v}</b></div>`).join('')}</div>
      <div class="panel"><h2>Cities</h2>${s.cities.map((c) => `<div class="hbar"><span>${esc(c.city)}</span><div><i style="width:${c.n / maxCity * 100}%;background:${c.city === 'Bangalore' ? 'var(--primary)' : 'var(--coral)'}"></i></div><b>${c.n}</b></div>`).join('') || '<p class="hint">No members yet.</p>'}
        <p class="hint" style="margin:10px 0 0">Only Bangalore is live. ${s.waitlist} people are on the waitlist for other cities.</p></div>
    </div>`;
}

const REJECT = ['The Instagram or LinkedIn doesn’t look like the same person as the photos', 'The account looks fake, private or brand new', 'Photos are unclear or not of a real person', 'Looks under 18', 'The ID is unreadable or doesn’t match the selfie'];
let QI = 0;
async function review() {
  const list = await api('/pending');
  if (QI >= list.length) QI = Math.max(0, list.length - 1);
  if (!list.length) { $('view').innerHTML = '<div class="panel empty-s"><b>All caught up</b>Nobody is waiting for review.</div>'; return; }
  const draw = () => {
    const u = list[QI];
    const items = list.map((x, i) => `<button class="qitem" data-i="${i}" aria-current="${i === QI}"><b>${esc(x.name)}, ${x.age}</b><small>${esc(x.city)} · ${esc(x.mode)} · waiting ${ago(x.submitted_at || x.created_at)}</small>
      <span class="tags">${x.insta ? '<span class="tag">Instagram</span>' : ''}${x.linkedin ? '<span class="tag">LinkedIn</span>' : ''}${x.has_id ? '<span class="tag id">ID</span>' : ''}${x.status === 'verified' ? '<span class="tag re">Badge request</span>' : ''}</span></button>`).join('');
    const badgeOnly = u.status === 'verified';
    $('view').innerHTML = `<div class="review"><div class="qlist" role="list">${items}</div>
      <div class="panel detail">
        <div class="head"><div><h2>${esc(u.name)}, ${u.age}</h2>
          <div class="meta">${esc(u.gender)}, interested in ${esc((u.interested || []).join(', ') || '—')} · ${esc(u.mode)} · ${esc(u.city)}<br>${esc(u.phone)} · joined ${date(u.created_at)}${badgeOnly ? ' · <b>already verified, asking for the ID badge</b>' : ''}</div></div>
          <span class="kbd"><kbd>J</kbd>/<kbd>K</kbd> next/previous · <kbd>A</kbd> approve · <kbd>R</kbd> reject</span></div>
        <div class="linkbtns">${u.insta ? `<a href="${esc(u.insta)}" target="_blank" rel="noopener noreferrer">Open Instagram: ${esc(u.insta.replace('https://www.instagram.com/', '@'))}</a>` : ''}${u.linkedin ? `<a href="${esc(u.linkedin)}" target="_blank" rel="noopener noreferrer">Open LinkedIn: ${esc(u.linkedin.replace('https://www.linkedin.com/in/', ''))}</a>` : ''}${!u.insta && !u.linkedin ? '<span class="hint">No social link. ID only.</span>' : ''}</div>
        <div class="gallery">${u.photos.map((p, i) => `<figure><img data-src="/photo/${p.id}" alt="Profile photo ${i + 1}"><figcaption>Profile photo ${i + 1}</figcaption></figure>`).join('')}
          ${u.has_id ? `<figure><img data-src="/verification/${u.id}/selfie" alt="Selfie"><figcaption>Selfie</figcaption></figure><figure><img data-src="/verification/${u.id}/id" alt="ID"><figcaption>${esc(u.id_type)}</figcaption></figure>` : ''}</div>
        ${u.has_id ? `<div class="idbox">${esc(u.id_type)}: the typed number ends in <b>${esc(u.id_last4 || '????')}</b>. Check it matches the ID photo, and the selfie matches the ID and profile photos.</div>` : ''}
        ${(u.prompt_a || u.bio || (u.tags || []).length) ? `<div class="about">${u.prompt_a ? `<div><small>${esc(u.prompt_q)}</small>${esc(u.prompt_a)}</div>` : ''}${u.bio ? `<div><small>About</small>${esc(u.bio)}</div>` : ''}${(u.tags || []).length ? `<div><small>Interests</small>${esc(u.tags.join(', '))}</div>` : ''}</div>` : ''}
        <ul class="check"><li>Open the link in a private window: real, active account with its own posts or work history.</li><li>Same person as the profile photos.</li><li>Looks 18 or older; date of birth looks plausible.</li>${u.has_id ? '<li>ID readable, last 4 match, selfie matches the ID.</li>' : ''}</ul>
        <div class="actbar">
          ${u.has_id ? `<button class="btn coral" data-act="id">${badgeOnly ? 'Approve ID badge' : 'Approve with ID badge'}</button>${badgeOnly ? '' : '<button class="btn" data-act="ok">Approve without badge</button>'}` : '<button class="btn" data-act="ok">Approve</button>'}
          <button class="btn ghost" data-act="no">${badgeOnly ? 'Reject ID' : 'Reject'}</button>
        </div>
      </div></div>`;
    loadImgs($('view'));
    $('view').querySelectorAll('.qitem').forEach((b) => b.onclick = () => { QI = +b.dataset.i; draw(); });
    $('view').querySelectorAll('[data-act]').forEach((b) => b.onclick = () => decide(b.dataset.act));
  };
  const decide = async (act) => {
    const u = list[QI];
    try {
      if (act === 'no') {
        const reason = await ask({ title: 'Reject ' + u.name + '?', body: 'The reason is shown to them so they can try again.', ok: 'Reject', danger: true, options: REJECT });
        if (reason === false) return;
        await api('/decide/' + u.id, { method: 'POST', body: { approve: false, reason } });
      } else await api('/decide/' + u.id, { method: 'POST', body: { approve: true, id_ok: act === 'id' } });
      toast(act === 'no' ? 'Rejected' : 'Approved');
      list.splice(QI, 1); COUNTS.pending = Math.max(0, (COUNTS.pending || 1) - 1); drawNav('review');
      if (!list.length) return review();
      if (QI >= list.length) QI = list.length - 1;
      draw();
    } catch (x) { toast(x.message); }
  };
  document.onkeydown = (e) => {
    if (document.querySelector('.dlg') || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === 'j' && QI < list.length - 1) { QI++; draw(); } else if (k === 'k' && QI > 0) { QI--; draw(); }
    else if (k === 'a') decide(list[QI].has_id ? 'id' : 'ok'); else if (k === 'r') decide('no');
  };
  draw();
}

const chip = (st) => `<span class="chip-s st-${esc(st)}">${esc(st)}</span>`;
async function members() {
  $('view').innerHTML = `<div class="tools"><input id="mq" type="search" placeholder="Search name, phone, Instagram or LinkedIn" aria-label="Search members"><select id="ms" aria-label="Status"><option value="">All statuses</option><option>verified</option><option>pending</option><option>new</option><option>rejected</option><option>banned</option></select></div><div id="mt"></div>`;
  const run = async () => {
    const rows = await api('/members?q=' + encodeURIComponent($('mq').value) + '&status=' + $('ms').value);
    $('mt').innerHTML = rows.length ? `<table class="t"><thead><tr><th>Member</th><th>Phone</th><th>Status</th><th>Category</th><th>City</th><th>Matches</th><th>Reports</th><th>Joined</th></tr></thead><tbody>
      ${rows.map((r) => `<tr class="click" data-uid="${r.id}"><td><b>${esc(r.name || 'No name yet')}</b><small>${r.age ? r.age + ', ' : ''}${esc(r.gender || '')}${r.id_verified ? ' · ID verified' : ''}${r.paused ? ' · paused' : ''}</small></td><td>${esc(r.phone)}</td><td>${chip(r.status)}</td><td>${esc(r.mode)}</td><td>${esc(r.city)}</td><td>${r.matches}</td><td>${r.reports ? `<b style="color:#C8372D">${r.reports}</b>` : 0}</td><td>${date(r.created_at)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="panel empty-s"><b>No members found</b>Try a different search.</div>';
    $('mt').querySelectorAll('tr[data-uid]').forEach((tr) => tr.onclick = () => member(tr.dataset.uid, run));
  };
  let t; $('mq').oninput = () => { clearTimeout(t); t = setTimeout(run, 250); }; $('ms').onchange = run;
  run();
}
async function member(uid, after) {
  const m = await api('/member/' + uid);
  closeLayer();
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = closeLayer;
  const d = document.createElement('aside'); d.className = 'drawer';
  d.innerHTML = `<button class="btn ghost sm" type="button" id="dx" style="float:right">Close</button><h2 style="font-size:24px;margin:0 0 4px">${esc(m.name || 'No name yet')}${m.age ? ', ' + m.age : ''}</h2>
    <div class="meta">${chip(m.status)} ${m.id_verified ? '<span class="chip-s st-pending">ID verified</span>' : ''}<br>${esc(m.gender)} · ${esc(m.mode)} · ${esc(m.city)} · ${esc(m.phone)} · joined ${date(m.created_at)}</div>
    <div class="linkbtns">${m.insta ? `<a href="${esc(m.insta)}" target="_blank" rel="noopener noreferrer">Instagram</a>` : ''}${m.linkedin ? `<a href="${esc(m.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn</a>` : ''}</div>
    <div class="gallery">${m.photos.map((p, i) => `<figure><img data-src="/photo/${p.id}" alt="Photo ${i + 1}"></figure>`).join('') || '<p class="hint">No photos.</p>'}</div>
    ${m.bio || m.prompt_a ? `<div class="about" style="grid-template-columns:1fr">${m.prompt_a ? `<div><small>${esc(m.prompt_q)}</small>${esc(m.prompt_a)}</div>` : ''}${m.bio ? `<div><small>About</small>${esc(m.bio)}</div>` : ''}</div>` : ''}
    <h3 style="font-size:16px;margin:18px 0 8px">Reports (${m.reports.length})</h3>
    ${m.reports.map((r) => `<div class="about" style="grid-template-columns:1fr;margin:6px 0"><div><small>${date(r.created_at)}${r.resolved ? ' · resolved' : ''}</small>${esc(r.reason || 'No reason given')}</div></div>`).join('') || '<p class="hint">No reports.</p>'}
    <div class="actbar" style="background:#fff">${m.status === 'banned' ? '<button class="btn" id="unban">Unban</button>' : '<button class="btn danger" id="ban">Ban member and their ID</button>'}</div>`;
  document.body.append(s, d);
  loadImgs(d);
  d.querySelector('#dx').onclick = closeLayer;
  const b = d.querySelector('#ban'), ub = d.querySelector('#unban');
  if (b) b.onclick = async () => { if (await ask({ title: 'Ban ' + (m.name || 'this member') + '?', body: 'Their matches close, and their ID and links can’t be used to join again.', ok: 'Ban', danger: true })) { await api('/ban/' + m.id, { method: 'POST' }); toast('Banned'); closeLayer(); after && after(); } };
  if (ub) ub.onclick = async () => { if (await ask({ title: 'Unban ' + (m.name || 'this member') + '?', body: 'They become a verified member again.', ok: 'Unban' })) { await api('/unban/' + m.id, { method: 'POST' }); toast('Unbanned'); closeLayer(); after && after(); } };
}
async function reports() {
  const rows = await api('/reports');
  $('view').innerHTML = rows.length ? `<table class="t"><thead><tr><th>Reported member</th><th>What happened</th><th>Scam flags</th><th>Reported</th><th></th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td><b>${esc(r.reported_name)}</b><small>${esc(r.reported_phone)} · by member #${r.reporter ?? '—'}</small></td><td style="max-width:420px">${esc(r.reason || 'No reason given')}</td><td>${r.flags}</td><td>${date(r.created_at)}</td>
      <td><div class="rowact"><button class="btn ghost sm" data-view="${r.reported}">View</button><button class="btn ghost sm" data-res="${r.id}">Dismiss</button><button class="btn danger sm" data-ban="${r.reported}" data-name="${esc(r.reported_name)}">Ban</button></div></td></tr>`).join('')}</tbody></table>`
    : '<div class="panel empty-s"><b>No open reports</b>Reports from members appear here.</div>';
  wireRowActions(reports);
}
async function flags() {
  const rows = await api('/flagged');
  $('view').innerHTML = `<p class="hint" style="margin:-4px 0 14px">Members whose messages mentioned money, crypto, OTPs or links. The receiver was warned; check before banning.</p>` + (rows.length ? `<table class="t"><thead><tr><th>Member</th><th>Flagged messages</th><th>Kinds</th><th></th></tr></thead><tbody>
    ${rows.map((f) => `<tr><td><b>${esc(f.name)}</b><small>${esc(f.phone)}</small></td><td>${f.flags}</td><td>${esc((f.kinds || []).join(', '))}</td><td><div class="rowact"><button class="btn ghost sm" data-view="${f.id}">View</button><button class="btn danger sm" data-ban="${f.id}" data-name="${esc(f.name)}">Ban</button></div></td></tr>`).join('')}</tbody></table>`
    : '<div class="panel empty-s"><b>Nothing flagged</b>Suspicious messages appear here.</div>');
  wireRowActions(flags);
}
function wireRowActions(reload) {
  $('view').querySelectorAll('[data-view]').forEach((b) => b.onclick = () => member(b.dataset.view, reload));
  $('view').querySelectorAll('[data-res]').forEach((b) => b.onclick = async () => { await api('/reports/' + b.dataset.res + '/resolve', { method: 'POST' }); toast('Dismissed'); reload(); });
  $('view').querySelectorAll('[data-ban]').forEach((b) => b.onclick = async () => { if (await ask({ title: 'Ban ' + b.dataset.name + '?', body: 'Their matches close, and their ID and links can’t be used to join again.', ok: 'Ban', danger: true })) { await api('/ban/' + b.dataset.ban, { method: 'POST' }); toast('Banned'); reload(); } });
}
async function tickets() {
  const rows = await api('/tickets');
  $('view').innerHTML = rows.length ? `<table class="t"><thead><tr><th>From</th><th>Message</th><th>Received</th><th></th></tr></thead><tbody>
    ${rows.map((t) => `<tr><td><b>${esc(t.name || 'Visitor')}</b><small>${esc(t.phone || t.contact || '')}</small></td><td style="max-width:520px">${esc(t.message)}</td><td>${date(t.created_at)}</td><td><div class="rowact"><button class="btn sm" data-tk="${t.id}">Mark resolved</button></div></td></tr>`).join('')}</tbody></table>`
    : '<div class="panel empty-s"><b>No open tickets</b>Messages sent through Help appear here.</div>';
  $('view').querySelectorAll('[data-tk]').forEach((b) => b.onclick = async () => { await api('/tickets/' + b.dataset.tk + '/resolve', { method: 'POST' }); toast('Resolved'); tickets(); });
}
async function waitlist() {
  const rows = await api('/waitlist');
  const by = {}; rows.forEach((r) => { const c = (r.city || 'Not given').trim(); by[c] = (by[c] || 0) + 1; });
  $('view').innerHTML = `<div class="kpis">${Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([c, n]) => `<div class="kpi"><small>${esc(c)}</small><b>${n}</b></div>`).join('') || '<div class="kpi"><small>Waitlist</small><b>0</b></div>'}</div>` +
    (rows.length ? `<table class="t"><thead><tr><th>Phone</th><th>City</th><th>Joined</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.phone)}</td><td>${esc(r.city)}</td><td>${date(r.created_at)}</td></tr>`).join('')}</tbody></table>` : '<div class="panel empty-s"><b>Nobody on the waitlist yet</b></div>');
}
const VIEWS = { overview, review, members, reports, flags, tickets, waitlist };
async function go() {
  if (!PW) return;
  const k = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
  document.onkeydown = null; closeLayer();
  $('title').textContent = SECTIONS.find((x) => x[0] === k)[1];
  try { COUNTS = await api('/stats'); } catch (x) { return; }
  drawNav(k);
  $('view').innerHTML = '<p class="hint">Loading…</p>';
  try { await VIEWS[k](); $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); }
  catch (x) { $('view').innerHTML = `<div class="panel empty-s"><b>Couldn’t load this</b>${esc(x.message)}</div>`; }
}
async function start() {
  try { await api('/stats'); } catch (x) { $('lerr').textContent = x.message; return false; }
  sessionStorage.setItem('pzpw', PW);
  $('login').hidden = true; $('shell').hidden = false;
  go(); return true;
}
$('lf').onsubmit = (e) => { e.preventDefault(); PW = $('pw').value; $('lerr').textContent = ''; start(); };
$('out').onclick = signOut;
$('refresh').onclick = go;
window.addEventListener('hashchange', go);
if (PW) start();
</script>
</body>
</html>
