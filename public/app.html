<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAUSE</title>
<meta name="description" content="PAUSE — verified, slow dating. 5 chats at a time. Stay masked till you both unmask.">
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#110E18">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
#root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:22px 20px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top h1{margin:0;font-size:30px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}
.navbar div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.navbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:6px 0;text-decoration:none;font-size:11px;color:var(--muted)}
.navbar a[aria-current="page"]{color:var(--ink);font-weight:600}
.navbar a[aria-current="page"]::before{content:'';position:absolute;top:-7px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--coral),var(--violet))}
.navbar .badge{position:absolute;top:2px;right:16px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.av{width:48px;height:48px;border-radius:24px;object-fit:cover;background:#5B5266;flex:none;display:block}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-family:Inter;font-weight:700;margin:26px 0 10px}
.fade-in{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{transition:transform .12s ease,box-shadow .2s ease,background .2s}
.btn:active,.round:active,.pill:active,.catcard:active{transform:scale(.97)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}

/* category chips + cards */
.cat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.cat.steady{background:var(--steady-bg);color:var(--steady)}.cat.forever{background:var(--forever-bg);color:var(--forever)}.cat.afterdark{background:var(--dark-bg);color:var(--dark)}
.sw{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.sw.on{background:var(--ink);border-color:var(--ink);color:#fff}
.catgrid{display:flex;flex-direction:column;gap:10px}
.catcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.catcard .em{font-size:28px;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.catcard b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;letter-spacing:-.02em}
.catcard span.l{font-size:13px;color:var(--muted)}
.catcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 12px 26px -18px rgba(22,18,29,.7)}
.catcard.steady .em{background:var(--steady-bg)}.catcard.forever .em{background:var(--forever-bg)}.catcard.afterdark .em{background:var(--dark-bg)}
.toggle{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:10px}
.toggle .em{font-size:24px;width:44px;height:44px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.toggle .tx{flex:1;min-width:0}.toggle .tx b{display:block;font-size:15px}.toggle .tx span{font-size:13px;color:var(--muted);line-height:1.4}
.tg{position:relative;width:52px;height:30px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;border-radius:15px;background:#D8D0C5;transition:background .2s}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked+i{background:var(--ink)}.tg input:checked+i::after{transform:translateX(22px)}
.tg input:focus-visible+i{outline:3px solid var(--violet);outline-offset:2px}
.card .toggle{border:none;padding-left:0;padding-right:0;margin:0}
.linkbtn{background:none;border:none;padding:0;color:var(--violet);font-weight:600;cursor:pointer;font-size:13px;text-decoration:underline}

/* photos editor */
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .slot{position:relative;aspect-ratio:3/4;border-radius:14px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px dashed #D0C6B9}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.profilehead{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:#fff;border:1px solid var(--line);margin-bottom:18px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--violet));border-radius:3px}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-family:Inter,sans-serif;font-size:12px;font-weight:600;background:#2F6FDB;color:#fff;padding:4px 8px;border-radius:999px;vertical-align:middle;letter-spacing:0}

/* picks */
.strip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:14px;text-decoration:none;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#3B2A7A 0%,#1B1725 60%);border:1px solid #3B3449}
.strip .orb{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#fff 0,#CDBFFF 25%,#6A4DF4 70%);box-shadow:0 0 22px rgba(106,77,244,.7);flex:none}
.strip.ready{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(106,77,244,0)}50%{box-shadow:0 0 30px rgba(106,77,244,.55)}}
.strip.light{background:#fff;color:var(--ink);border:1px dashed #CFC4F5}
.dots{display:flex;gap:5px;justify-content:center;margin:2px 0 12px}
.dots i{width:6px;height:6px;border-radius:3px;background:#D6D0C6;transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.pick{overflow:hidden;border:none;box-shadow:0 30px 60px -36px rgba(22,18,29,.55);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.pick.out-left{transform:translateX(-120%) rotate(-12deg);opacity:0}
.pick.out-right{transform:translateX(120%) rotate(12deg);opacity:0}
.pick .ph{position:relative;aspect-ratio:3/3.7;background:#2A2733}
.pick .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pick .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.8));pointer-events:none}
.mask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;z-index:1;text-align:center;padding:0 30px}
.mask .big{font-size:64px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.mask span{font-size:13px;background:rgba(17,14,24,.6);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.pick .over{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}
.pick .over h2{margin:0;font-size:32px;line-height:1.05;color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badges span{font-size:12px;font-weight:600;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px}
.badges span.d{background:rgba(106,77,244,.85)}.badges span.k{background:rgba(242,179,61,.92);color:#2A1C00}
.pick .body{padding:18px;display:flex;flex-direction:column;gap:12px}
.prompt{padding:14px 16px;border-radius:16px}
.prompt small{display:block;font-size:12px;font-weight:700}
.prompt p{margin:6px 0 0;font-size:18px;line-height:1.35;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;letter-spacing:-.01em}
.reasons{margin:0;padding:12px 14px;border-radius:14px;background:#F1EDFF;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2B1F6B}
.actions{display:flex;gap:14px;margin-top:16px}
.round{width:60px;height:60px;border-radius:30px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.empty{padding:30px 22px;text-align:center;border-radius:24px;background:#fff;border:1px solid var(--line)}
.empty h2{margin:14px 0 8px;font-size:24px}

/* focus meter + chats */
.focus{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--ink);color:#fff;margin-bottom:16px}
.focus .slots{display:flex}
.focus .slots i{width:34px;height:34px;border-radius:17px;border:2px solid var(--ink);background:#2E2838;margin-left:-8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.focus .slots i:first-child{margin-left:0}
.focus .slots i.free{background:transparent;border:2px dashed #5A5268}
.focus .slots img{width:100%;height:100%;object-fit:cover}
.list a{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;border-bottom:1px solid var(--line)}
.list a:last-child{border-bottom:none}
.step{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.step.s0{background:#EDE8FF;color:#4630C8}.step.s1{background:#E3F4EA;color:#17633A}.step.s2{background:#FFF0D3;color:#7D5000}

/* dark chat */
.night{background:var(--night);color:#F6F3EE;min-height:100vh}
.chathead{position:sticky;top:0;background:rgba(17,14,24,.94);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--night3);z-index:3}
.chathead a,.chathead button{color:#F6F3EE}
.steps{display:flex;gap:6px;padding:12px 16px 4px}
.steps div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;color:#7D7889}
.steps i{height:4px;border-radius:2px;background:var(--nline)}
.steps .on{color:#F6F3EE}.steps .on i{background:linear-gradient(90deg,var(--coral),var(--violet))}
.msgs{padding:14px 16px 190px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.m.them{align-self:flex-start;background:var(--night3);border-radius:18px 18px 18px 6px}
.m.me{align-self:flex-end;background:var(--violet);color:#fff;border-radius:18px 18px 6px 18px}
.m.sys{align-self:center;font-size:12px;color:#A9A3B5;padding:2px 8px;text-align:center;max-width:90%}
.warn{align-self:flex-start;max-width:85%;margin-top:-4px;font-size:12px;line-height:1.4;color:#FFD9A8;background:rgba(242,179,61,.12);border:1px solid rgba(242,179,61,.35);padding:8px 10px;border-radius:12px}
.game{align-self:stretch;margin:4px 0;padding:14px;border-radius:18px;background:linear-gradient(160deg,#2A2140,#1B1725);border:1px solid #3F3460}
.game h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:#CDBFFF}
.game .q{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;margin-bottom:10px}
.game .opts{display:flex;gap:8px;flex-wrap:wrap}
.game .opts button{flex:1;min-width:120px;min-height:46px;border-radius:12px;border:1px solid #5A4C86;background:#231C36;color:#fff;font-weight:600;cursor:pointer}
.game .opts button.pick1{background:#F6F3EE;color:var(--night);border-color:#F6F3EE}
.game .st{display:flex;flex-direction:column;gap:8px}
.game .st button,.game .st div{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid #5A4C86;background:#231C36;color:#fff;font-size:14px;line-height:1.35}
.game .st button{cursor:pointer}
.game .st .lie{border-color:#FF6A5C;background:rgba(255,106,92,.14)}
.game small{display:block;margin-top:8px;color:#A9A3B5;font-size:12px}
.revealbox{margin:4px 14px;padding:14px;border-radius:18px;background:var(--night2);border:1px solid var(--nline);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.45}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:linear-gradient(180deg,rgba(17,14,24,0),var(--night) 22%)}
.dock>div{max-width:480px;margin:0 auto}
.composer{padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
.composer input{flex:1;min-width:0;min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--nline);background:var(--night2);color:#F6F3EE;font-size:16px}
.composer .ib{width:46px;height:46px;border-radius:23px;border:1px solid var(--nline);background:var(--night2);color:#fff;font-size:20px;cursor:pointer;flex:none}
.composer .send{border:none;background:var(--violet)}
.lightbtn{min-height:46px;padding:0 14px;border-radius:12px;border:none;background:#F6F3EE;color:var(--night);font-weight:700;cursor:pointer}
.darkbtn{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--nline);background:transparent;color:#F6F3EE;cursor:pointer;font-weight:600}
.unmaskbtn{width:100%;min-height:50px;border:none;border-radius:14px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#FF6A5C,#6A4DF4)}
.menu{position:absolute;right:12px;top:62px;background:var(--night2);border:1px solid var(--nline);border-radius:14px;padding:6px;display:flex;flex-direction:column;z-index:6;min-width:210px}
.menu button{background:none;border:none;color:#F6F3EE;text-align:left;padding:12px 14px;min-height:44px;cursor:pointer;border-radius:10px}
.menu button:hover{background:var(--night3)}

/* sheets: games + help */
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,14,.55);z-index:40;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:#fff;color:var(--ink);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#DDD5CA;margin:0 auto 12px}
.sheet h3{margin:0 0 6px;font-size:22px}
.gamecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);cursor:pointer;margin-top:10px}
.gamecard b{display:block}
.askdot{width:22px;height:22px;border-radius:11px;background:linear-gradient(135deg,var(--coral),var(--violet));color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.helpfab{position:fixed;right:max(16px,calc(50% - 224px));bottom:86px;z-index:9;display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border-radius:22px;border:none;background:var(--ink);color:#fff;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 12px 24px -10px rgba(22,18,29,.6)}
.helpfab i{width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,var(--coral),var(--violet));display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.hmsgs{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.hm{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.hm.bot{align-self:flex-start;background:var(--soft);border-radius:16px 16px 16px 6px}
.hm.you{align-self:flex-end;background:var(--ink);color:#fff;border-radius:16px 16px 6px 16px}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}

/* overlays */
.celebrate{position:fixed;inset:0;z-index:50;background:rgba(17,14,24,.97);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;animation:fadeUp .4s both}
.celebrate .pair{display:flex}
.celebrate .pair div{width:110px;height:110px;border-radius:55px;border:4px solid var(--night);overflow:hidden;background:#3A3348;display:flex;align-items:center;justify-content:center;font-size:52px}
.celebrate .pair div:last-child{margin-left:-26px}
.celebrate img{width:100%;height:100%;object-fit:cover}
.unmaskfx .big{font-size:90px;animation:flip 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(540deg) scale(1.3)}100%{transform:rotateY(720deg) scale(1)}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* questionnaire */
.qwrap{min-height:100vh;display:flex;flex-direction:column;padding:22px 20px 30px;background:radial-gradient(120% 60% at 50% 0%,#2B1F57 0%,var(--night) 60%);color:#fff}
.qbar{height:6px;border-radius:3px;background:#2E2740;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--violet));transition:width .3s}
.qwrap h2{font-size:30px;line-height:1.1;margin:26px 0 20px;color:#fff}
.qopt{display:block;width:100%;text-align:left;min-height:56px;padding:14px 16px;margin-bottom:10px;border-radius:16px;border:1px solid #463C5E;background:rgba(255,255,255,.05);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.qopt[aria-pressed="true"],.qopt:hover{background:#F6F3EE;color:var(--night);border-color:#F6F3EE}
.kres{padding:16px;border-radius:18px;background:var(--forever-bg);color:#3A2600}
.kres b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px}
.authhero{position:relative;height:250px;margin:-22px -20px 0;overflow:hidden;background:var(--night)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/ask.js"></script>
<script src="/app.js"></script>
</body>
</html>
