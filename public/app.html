<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAUSE</title>
<meta name="description" content="PAUSE — verified, unhurried dating. Up to five matches at a time. Stay masked until you both choose to unmask.">
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#062433">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
#root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:24px 20px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{margin:0;font-size:34px;letter-spacing:-.04em}
.back{display:flex;width:44px;height:44px;align-items:center;justify-content:flex-start;color:inherit;text-decoration:none;background:none;border:none;cursor:pointer;padding:0}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--hair);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
.navbar div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.navbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;padding:7px 0 4px;text-decoration:none;font-size:11px;font-weight:500;color:var(--muted)}
.navbar a .ic{width:22px;height:22px}
.navbar a[aria-current="page"]{color:var(--primary);font-weight:600}
.navbar a[aria-current="page"]::after{content:'';width:4px;height:4px;border-radius:2px;background:var(--primary);position:absolute;bottom:-2px;left:50%;margin-left:-2px}
.navbar .badge{position:absolute;top:3px;right:14px;min-width:16px;height:16px;border-radius:8px;background:var(--claret);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.av{width:48px;height:48px;border-radius:24px;object-fit:cover;background:var(--night3);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ivory);font-family:var(--display);font-weight:800;font-size:18px}
.section-t{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin:30px 0 12px}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--midnight);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;box-shadow:0 18px 40px -20px rgba(6,36,51,.6)}
.circ{width:40px;height:40px;border-radius:20px;border:1px solid var(--hair2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);background:var(--surface)}
.circ.brass{color:var(--brass);border-color:#FFE2A0;background:var(--brass-soft)}

/* category + switch tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid var(--hair2);background:var(--surface);color:var(--ink)}
.tag .ic{width:15px;height:15px}
.tag.on{background:var(--midnight);border-color:var(--midnight);color:#fff}
.tag.on.brassy{background:var(--brass-soft);border-color:#FFE2A0;color:#6B4A00}
.catgrid{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:18px;background:var(--surface);overflow:hidden}
.catcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border:none;border-bottom:1px solid var(--hair);background:none;cursor:pointer}
.catcard:last-child{border-bottom:none}
.catcard b{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:20px;color:var(--heading)}
.catcard span.l{font-size:13px;color:var(--muted)}
.catcard .tick{margin-left:auto;width:22px;height:22px;border-radius:11px;border:1.5px solid var(--hair2);flex:none;display:flex;align-items:center;justify-content:center}
.catcard[aria-pressed="true"]{background:#F5FAF9}
.catcard[aria-pressed="true"] .tick{background:var(--primary);border-color:var(--primary)}
.catcard[aria-pressed="true"] .tick::after{content:'';width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.toggle{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--hair);margin-bottom:10px}
.toggle .tx{flex:1;min-width:0}.toggle .tx b{display:block;font-size:15px;font-weight:600}.toggle .tx span{font-size:13px;color:var(--muted);line-height:1.45}
.card .toggle{border:none;padding-left:0;padding-right:0;margin:0;border-radius:0}
.tg{position:relative;width:48px;height:28px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;border-radius:14px;background:var(--hair2);transition:background .2s}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(6,36,51,.25);transition:transform .2s}
.tg input:checked+i{background:var(--coral)}.tg input:checked+i::after{transform:translateX(20px)}
.tg input:focus-visible+i{outline:2px solid var(--brass);outline-offset:2px}
.linkbtn{background:none;border:none;padding:0;color:var(--ink);font-weight:600;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* profile */
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .slot{position:relative;aspect-ratio:3/4;border-radius:12px;background:var(--wash);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px dashed var(--hair2);color:var(--muted)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:none;background:rgba(6,36,51,.7);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.profilehead{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--hair);margin-bottom:20px}
.bar{height:3px;border-radius:2px;background:var(--wash);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:2px}
.vtick{display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ok);letter-spacing:0;vertical-align:middle}
.vtick .ic{width:15px;height:15px}

/* picks */
.panel{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;margin-bottom:16px;background:linear-gradient(120deg,#0B3F52,#12808A);color:#fff;text-decoration:none}
.panel .circ{background:transparent;border-color:#2F6676;color:#FFD166}
.panel b{display:block;font-weight:600}
.panel small{display:block;font-size:13px;color:#BCD6D3}
.panel .act{margin-left:auto;font-size:13px;font-weight:600;color:#FFD166;white-space:nowrap}
.panel.light{background:var(--surface);color:var(--ink);border:1px solid var(--hair);width:100%;text-align:left;cursor:pointer;font:inherit}
.panel.light .circ{border-color:#FFE2A0;color:var(--brass);background:var(--brass-soft)}
.panel.light small{color:var(--muted)}
.panel.light .act{color:var(--ink)}
.counter{font-size:12px;color:var(--muted);text-align:right;margin:-6px 0 10px}
.pick{overflow:hidden;box-shadow:0 1px 2px rgba(6,36,51,.04),0 30px 60px -40px rgba(6,36,51,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.pick.out-left{transform:translateX(-110%);opacity:0}
.pick.out-right{transform:translateX(110%);opacity:0}
.pick .ph{position:relative;aspect-ratio:4/5;background:var(--night3)}
.pick .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pick .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,36,51,0) 48%,rgba(6,36,51,.82));pointer-events:none}
.masklabel{position:absolute;top:16px;left:16px;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(6,36,51,.55);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:600}
.masklabel .ic{width:16px;height:16px}
.pick .over{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;color:#fff}
.pick .over h2{margin:0;font-size:34px;color:#fff;letter-spacing:-.035em}
.pick .over .city{font-size:14px;color:rgba(255,255,255,.82);margin-top:6px;display:flex;align-items:center;gap:10px}
.pick .over .vtick{color:#BDEBDD}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badges span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
.badges span .ic{width:13px;height:13px}
.badges span.d{color:#FFE3A3}
.pick .body{padding:20px;display:flex;flex-direction:column;gap:16px}
.prompt small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.prompt p{margin:6px 0 0;font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:22px;line-height:1.25;color:var(--heading)}
.reasons{margin:0;padding:14px 16px;border-radius:14px;background:var(--brass-soft);list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;color:#5C4000}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons .ic{width:15px;height:15px;color:var(--brass);margin-top:3px}
.reasons b{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.facts div{padding:12px 0}
.facts small{display:block;font-size:12px;color:var(--muted)}
.facts span{font-weight:600;font-size:14px}
.actions{display:flex;gap:12px;margin-top:16px}
.round{width:56px;height:56px;border-radius:28px;border:1px solid var(--hair2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.empty{padding:34px 24px;text-align:center;border-radius:20px;background:var(--surface);border:1px solid var(--hair)}
.empty h2{margin:16px 0 8px;font-size:26px}
.empty .circ{margin:0 auto;width:52px;height:52px;border-radius:26px}

/* chats */
.focus{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:var(--midnight);color:#fff;margin-bottom:16px}
.focus .slots{display:flex;gap:6px}
.focus .slots i{width:30px;height:30px;border-radius:15px;background:var(--night3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-family:var(--display);font-weight:800;color:var(--ivory)}
.focus .slots i.free{background:transparent;border:1px solid #2F6676}
.focus .slots img{width:100%;height:100%;object-fit:cover}
.focus b{display:block;font-weight:600}.focus small{font-size:13px;color:#BCD6D3}
.list a{display:flex;gap:12px;align-items:center;padding:14px 16px;text-decoration:none;border-bottom:1px solid var(--hair)}
.list a:last-child{border-bottom:none}
.step{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.step.s0{background:var(--wash);color:var(--ink)}.step.s1{background:var(--ok-soft);color:var(--ok)}.step.s2{background:var(--brass-soft);color:#6B4A00}
.dot{width:7px;height:7px;border-radius:4px;background:var(--claret);display:inline-block}

/* dark chat */
.night{background:var(--night);color:#EAF4F2;min-height:100vh}
.chathead{position:sticky;top:0;background:rgba(6,36,51,.94);backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--night3);z-index:3}
.chathead a,.chathead button{color:#EAF4F2}
.chathead small{display:block;font-size:12px;color:#8FB4B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:6px;padding:14px 16px 4px}
.steps div{flex:1;display:flex;flex-direction:column;gap:7px;font-size:11px;font-weight:500;color:#7FA3A9}
.steps i{height:2px;border-radius:1px;background:var(--nline)}
.steps .on{color:#EAF4F2}.steps .on i{background:linear-gradient(90deg,#FF8A70,#FF6B57)}
.msgs{padding:16px 16px 190px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.m.them{align-self:flex-start;background:var(--night3);border-radius:18px 18px 18px 6px}
.m.me{align-self:flex-end;background:var(--coral);color:var(--coral-ink);border-radius:18px 18px 6px 18px}
.m.sys{align-self:center;font-size:12px;color:#8FB4B8;padding:2px 8px;text-align:center;max-width:88%}
.warn{align-self:flex-start;max-width:85%;margin-top:-4px;display:flex;gap:8px;font-size:12px;line-height:1.45;color:#FFE3A3;border:1px solid rgba(169,135,79,.45);padding:9px 11px;border-radius:12px}
.warn .ic{width:15px;height:15px;margin-top:1px}
.game{align-self:stretch;margin:4px 0;padding:16px;border-radius:18px;background:var(--night2);border:1px solid var(--nline)}
.game h4{margin:0 0 6px;font-size:12px;font-weight:600;color:#FFD166;font-family:var(--sans)}
.game .q{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:21px;margin-bottom:12px}
.game .opts{display:flex;gap:8px;flex-wrap:wrap}
.game .opts button{flex:1;min-width:120px;min-height:46px;border-radius:12px;border:1px solid var(--nline);background:transparent;color:#EAF4F2;font-weight:600;cursor:pointer}
.game .opts button.pick1{background:var(--coral);color:var(--coral-ink);border-color:var(--coral)}
.game .st{display:flex;flex-direction:column;gap:8px}
.game .st button,.game .st div{text-align:left;padding:11px 13px;border-radius:12px;border:1px solid var(--nline);background:transparent;color:#EAF4F2;font-size:14px;line-height:1.4}
.game .st button{cursor:pointer}
.game .st .lie{border-color:#FF9E8A;color:#FFDCD3}
.game small{display:block;margin-top:10px;color:#8FB4B8;font-size:12px}
.revealbox{margin:4px 14px;padding:14px 16px;border-radius:16px;background:var(--night2);border:1px solid var(--nline);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.5}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:linear-gradient(180deg,rgba(6,36,51,0),var(--night) 24%)}
.dock>div{max-width:480px;margin:0 auto}
.composer{padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
.composer input{flex:1;min-width:0;min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--nline);background:var(--night2);color:#EAF4F2;font-size:16px}
.composer .ib{width:48px;height:48px;border-radius:24px;border:1px solid var(--nline);background:var(--night2);color:#EAF4F2;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.composer .send{border:none;background:var(--coral);color:var(--coral-ink)}
.lightbtn{min-height:48px;padding:0 16px;border-radius:12px;border:none;background:var(--coral);color:var(--coral-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.darkbtn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--nline);background:transparent;color:#EAF4F2;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.menu{position:absolute;right:12px;top:64px;background:var(--night2);border:1px solid var(--nline);border-radius:14px;padding:6px;display:flex;flex-direction:column;z-index:6;min-width:220px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.menu button{background:none;border:none;color:#EAF4F2;text-align:left;padding:12px 14px;min-height:44px;cursor:pointer;border-radius:10px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--night3)}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,28,.5);z-index:40;animation:fadeIn .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--hair2);margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:24px}
.gamecard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--hair);background:var(--surface);cursor:pointer;margin-top:10px}
.gamecard b{display:block;font-weight:600}

/* overlays — the one orchestrated motion is the unmask */
.celebrate{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 20%,#0F5A66 0%,var(--night) 62%);color:#EAF4F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;animation:fadeIn .4s both}
.celebrate .pair{display:flex}
.celebrate .pair div{width:112px;height:112px;border-radius:56px;border:3px solid var(--night);overflow:hidden;background:var(--night3);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--ivory)}
.celebrate .pair div:last-child{margin-left:-24px}
.celebrate img{width:100%;height:100%;object-fit:cover}
.celebrate h2{margin:8px 0 0;font-size:42px;color:#fff}
.celebrate p{margin:0;color:#BCD6D3;max-width:300px;line-height:1.55}
.reveal-photo{width:220px;height:275px;border-radius:20px;overflow:hidden;background:var(--night3)}
.reveal-photo img{width:100%;height:100%;object-fit:cover;filter:blur(22px);transform:scale(1.12);transition:filter 1.6s cubic-bezier(.2,.7,.2,1),transform 1.6s cubic-bezier(.2,.7,.2,1)}
.reveal-photo.clear img{filter:blur(0);transform:scale(1)}

/* questionnaire */
.qwrap{min-height:100vh;display:flex;flex-direction:column;padding:24px 20px 30px;background:var(--night);color:#EAF4F2}
.qbar{height:2px;border-radius:1px;background:var(--nline);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#FF8A70,#FF6B57);transition:width .3s}
.qwrap h2{font-size:32px;line-height:1.15;margin:28px 0 22px;color:#fff}
.qopt{display:block;width:100%;text-align:left;min-height:56px;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--nline);background:transparent;color:#EAF4F2;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.qopt:hover{border-color:#4F8290}
.qopt[aria-pressed="true"]{background:var(--coral);color:var(--coral-ink);border-color:var(--coral)}
.kres{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--brass-soft);color:#5C4000}
.kres b{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:21px}

/* sign-up */
.authhero{position:relative;height:300px;margin:-24px -20px 0;overflow:hidden;background:var(--dusk);color:#EAF4F2;display:flex;align-items:flex-end;justify-content:center}
.authhero .wordmark{position:absolute;top:22px;left:20px;color:#fff}
.portrait{position:relative;width:150px;height:188px;border-radius:75px 75px 20px 20px;overflow:hidden;border:2px solid rgba(255,255,255,.5);box-shadow:0 24px 50px -20px rgba(6,36,51,.6)}
.portrait>svg{position:absolute;inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px)}
.portrait span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(6,36,51,.6);backdrop-filter:blur(6px);white-space:nowrap}
.portrait span .ic{width:14px;height:14px}
/* new look: stickers and avatars */
.celebrate .btn:not(.ghost),.qwrap .btn:not(.ghost),.night .btn:not(.ghost){background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}
.celebrate .btn:not(.ghost):hover,.qwrap .btn:not(.ghost):hover,.night .btn:not(.ghost):hover{background:var(--coral-hover)}
.authhero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,87,.35),transparent 68%);right:-60px;top:-80px}
.ahs{position:relative;width:330px;height:226px}
.ahs>span:not(.stk){position:absolute;display:block}
.ahs .o1{left:8px;top:92px;width:150px;height:154px;transform:rotate(-8deg)}
.ahs .o2{right:14px;top:70px;width:132px;height:136px;transform:rotate(7deg)}
