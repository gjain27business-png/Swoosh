<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swoosh</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#17161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
#root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:24px 20px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{margin:0;font-size:28px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.navbar div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.navbar a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:6px 0;text-decoration:none;font-size:11px;color:var(--muted)}
.navbar a[aria-current="page"]{color:var(--ink);font-weight:600}
.pick{overflow:hidden}
.pick .ph{position:relative;aspect-ratio:3/3.4;background:#2A2733}
.pick .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lockbadge{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(23,22,28,.75);color:#fff;font-size:12px}
.pick .body{padding:18px;display:flex;flex-direction:column;gap:10px}
.actions{display:flex;gap:14px;margin-top:16px}
.round{width:60px;height:60px;border-radius:30px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .slot{position:relative;aspect-ratio:3/4;border-radius:12px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.row{display:flex;gap:12px}
.row>*{flex:1}
.list a{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;border-bottom:1px solid var(--line)}
.av{width:48px;height:48px;border-radius:24px;object-fit:cover;background:#5B5266;flex:none}
/* dark chat */
.night{background:var(--night);color:#F6F5F2;min-height:100vh}
.chathead{position:sticky;top:0;background:var(--night);display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--night3);z-index:2}
.chathead a,.chathead button{color:#F6F5F2}
.steps{display:flex;gap:6px;padding:14px 16px 4px}
.steps div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;color:#7D7889}
.steps i{height:4px;border-radius:2px;background:var(--nline)}
.steps .on{color:#F6F5F2}.steps .on i{background:var(--lilac)}
.msgs{padding:14px 16px 150px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.m.them{align-self:flex-start;background:var(--night3);border-radius:18px 18px 18px 6px}
.m.me{align-self:flex-end;background:var(--violet);color:#fff;border-radius:18px 18px 6px 18px}
.m.sys{align-self:center;font-size:12px;color:#A9A5B4;padding:2px}
.revealbox{margin:4px 16px;padding:14px;border-radius:18px;background:var(--night2);border:1px solid var(--nline);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.45}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--night);border-top:1px solid var(--night3);padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.composer form{max-width:480px;margin:0 auto;display:flex;gap:10px}
.composer input{flex:1;min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--nline);background:var(--night2);color:#F6F5F2;font-size:15px}
.lightbtn{min-height:44px;padding:0 14px;border-radius:12px;border:none;background:#F6F5F2;color:var(--night);font-weight:600;cursor:pointer}
.darkbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--nline);background:transparent;color:#F6F5F2;cursor:pointer}
.menu{position:absolute;right:12px;top:64px;background:var(--night2);border:1px solid var(--nline);border-radius:14px;padding:6px;display:flex;flex-direction:column;z-index:5}
.menu button{background:none;border:none;color:#F6F5F2;text-align:left;padding:12px 14px;min-height:44px;cursor:pointer;border-radius:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.switch{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px;accent-color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
</body>
</html>
